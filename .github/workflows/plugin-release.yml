name: Release unsigned Apollo candidates

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable prerelease source tag (for example v0.1.3-rc.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apollo-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify immutable tag and package identity
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const manifest = JSON.parse(fs.readFileSync("manifest.json"));
            const pkg = JSON.parse(fs.readFileSync("package.json"));
            if (process.env.RELEASE_TAG !== `v${manifest.version}` || pkg.version !== manifest.version) {
              throw new Error("Release tag, manifest and npm versions must match");
            }
          '
          python3 -c 'import json, sys; sys.path.insert(0, "scripts"); from release import require_preview_version; require_preview_version(json.load(open("manifest.json"))["version"])'
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Backend race tests and vet
        working-directory: backend
        run: go test -race -count=1 ./... && go vet ./...
      - name: Build and verify all five unsigned native candidates
        run: |
          npm run package:all
          git diff --exit-code -- ui
      - name: Smoke test the packaged Linux sidecar
        run: |
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          manifest = json.loads(pathlib.Path("manifest.json").read_text())
          package = pathlib.Path("dist") / ("release-v" + manifest["version"]) / (manifest["id"] + "-" + manifest["version"] + "-linux-x64.dbxp")
          with zipfile.ZipFile(package) as archive:
              packaged = json.loads(archive.read("manifest.json"))
              binary = pathlib.Path(os.environ["RUNNER_TEMP"]) / "apollo-packaged-smoke"
              binary.write_bytes(archive.read(packaged["entrypoints"]["backend"]["executable"]))
              binary.chmod(0o700)
          PY
          APOLLO_SMOKE_SIDECAR="$RUNNER_TEMP/apollo-packaged-smoke" npm run test:smoke
      - name: Publish immutable candidate assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isPrerelease > /tmp/apollo-release-state.json; then
            node --input-type=module -e '
              import fs from "node:fs";
              if (JSON.parse(fs.readFileSync("/tmp/apollo-release-state.json")).isPrerelease !== true) {
                throw new Error("Unsigned Preview candidates require a GitHub prerelease; refusing stable publication");
              }
            '
          else
            gh release create "$RELEASE_TAG" --verify-tag --prerelease \
              --title "Apollo Portal Console ${RELEASE_TAG#v} Preview" \
              --notes-file "docs/release-notes-$RELEASE_TAG.md"
          fi
          directory="dist/release-$RELEASE_TAG"
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          for file in "$directory"/*.dbxp "$directory"/*.artifact.json \
            "$directory"/release-candidates.json "$directory"/SHA256SUMS-"$RELEASE_TAG".txt \
            "$directory"/package-verification.json; do
            name="$(basename "$file")"
            if gh release download "$RELEASE_TAG" --pattern "$name" --dir "$temporary" >/dev/null 2>&1; then
              cmp "$file" "$temporary/$name" || {
                echo "Refusing to replace immutable published bytes: $name" >&2
                exit 1
              }
            else
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-apollo-${{ github.event.release.tag_name || inputs.tag }}
          path: dist/release-*/
          if-no-files-found: ignore
