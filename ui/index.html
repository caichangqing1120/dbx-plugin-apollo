/* Apollo-style advanced workbenches share the same panels, borders and form rhythm. */
.advanced-page .panel-heading .btn {

.scope-tabs {

.scope-tabs .btn {

}
.scope-tabs .btn:first-child {

}
.scope-tabs .btn:last-child {
  border-radius: 0 4px 4px 0;
}
.namespace-panel {

.namespace-more > summary {

  color: #555;

  background: #fff;
}
.namespace-more > summary::-webkit-details-marker {
  display: none;
}
.namespace-more .dropdown-menu {

.namespace-more .dropdown-menu .btn {

  padding: 8px 18px !important;
  margin: 0 !important;
  text-align: left;
  text-decoration: none;
  border-radius: 0;
  color: #555;

.gray-path {

  border: 1px solid #ddd;
  border-radius: 4px;
  margin-bottom: 20px;
}

}
.sync-grid {

  grid-template-columns: minmax(400px, 2fr) minmax(260px, 1fr);
  gap: 20px;
}
.workflow-steps {
  display: flex;
  gap: 20px;
  align-items: center;
  padding: 15px;
  margin-bottom: 20px;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 4px;
  color: #888;

}
.target-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 15px 0;
}
.target-list label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.workflow-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin: 0 0 24px;
}
.workflow-actions .btn {
  margin: 0;
}
.filter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 20px;
}
.filter-grid .form-field > span {
  width: 90px;
}
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 15px;
}
.limit-warning {
  padding: 12px 15px;
  background: #fcf8e3;
  border: 1px solid #faebcc;
  color: #8a6d3b;
  border-radius: 4px;
}
.trace-info {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 8px;
}
.trace-info dt {
  font-weight: 600;
}
.trace-info dd {
  margin: 0;
  overflow-wrap: anywhere;
}
.system-version {
  font-size: 18px;
  color: #555;
}
.advanced-page code {
  font-family: Menlo, Monaco, Consolas, monospace;
  font-size: 12px;
}
.advanced-page td {
  overflow-wrap: anywhere;
}
.advanced-page td pre {
  max-height: 160px;
  overflow: auto;
}
.advanced-page fieldset {
  margin: 0;
  padding: 0;
  border: 0;
}
.advanced-page input[type="checkbox"] {
  box-shadow: none;
  width: 14px;
  height: 14px;
}
.advanced-page .form-field select {
  min-width: 0;
}
.advanced-page .form-error {
  margin-bottom: 15px;
}
.advanced-page .admin-table .btn {
  font-size: 12px;
}
.filter-grid input {
  width: 100%;
}
@media (max-width: 1000px) {
  .filter-grid {

  .sync-grid {
    grid-template-columns: minmax(380px, 1fr) minmax(240px, 1fr);
  }

    gap: 10px;
  }
  .namespace-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
  }

    margin: 0;
  }

    gap: 0;
  }
}
.namespace-selection {
  display: flex;

  margin-bottom: 20px;
}
.namespace-selection label {
  display: flex;
  align-items: center;
  gap: 10px;

.advanced-page [hidden] {

}

  opacity: 0.65;

/* Configuration geometry follows the independently observed Apollo 2.5.2 page. */
.project-layout {
  padding: 20px 15px;

}
.project-sidebar {
  width: 195px;

  // src/portal.js
  function encodeBytes(bytes) {
    let result = "";
    for (let i = 0; i < bytes.length; i += 32768)
      result += String.fromCharCode(...bytes.subarray(i, i + 32768));
    return btoa(result);
  }
  function decodeBytes(text) {
    return Uint8Array.from(atob(text), (ch) => ch.charCodeAt(0));
  }

  function multipartFile(bytes, name, type = "application/octet-stream", boundary = "dbx-" + crypto.randomUUID()) {
    if (!/^[a-zA-Z0-9-]+$/.test(boundary))
      throw Error("Invalid multipart boundary");
    const safeName = String(name || "config.zip").replace(/["\r\n\\/]/g, "_");
    const safeType = /^[\w.+-]+\/[\w.+-]+$/.test(type) ? type : "application/octet-stream";
    const head2 = new TextEncoder().encode(
      `--${boundary}\r
Content-Disposition: form-data; name="file"; filename="${safeName}"\r
Content-Type: ${safeType}\r
\r
`
    );
    const tail = new TextEncoder().encode(`\r
--${boundary}--\r
`);
    if (head2.length + bytes.length + tail.length > 4 * 1024 * 1024)
      throw Error(
        "File exceeds the 4 MiB transport limit (including multipart headers)"
      );
    const result = new Uint8Array(head2.length + bytes.length + tail.length);
    result.set(head2);
    result.set(bytes, head2.length);
    result.set(tail, head2.length + bytes.length);
    return {
      bytes: result,
      contentType: "multipart/form-data; boundary=" + boundary
    };
  }
  function downloadName(disposition, fallback = "apollo-configs.zip") {
    let value = disposition?.match(/filename\*=UTF-8''([^;]+)/i)?.[1];
    if (value) {
      try {
        value = decodeURIComponent(value);
      } catch {
        value = "";
      }
    } else {
      const quoted = disposition?.match(/filename="([^"]*)"/i);
      value = quoted ? quoted[1] : disposition?.match(/filename=([^;]+)/i)?.[1];

    value = (value || "").split(/[\\/]/).pop().replace(/[\x00-\x1f]/g, "_").trim();

      "通过创建灰度版本，您可以对某些配置做灰度测试<br>灰度流程为:<br>&nbsp;&nbsp;1.创建灰度版本 <br>&nbsp;&nbsp;2.配置灰度配置项<br>&nbsp;&nbsp;3.配置灰度规则.如果是私有的 Namespace 可以按照客户端的 IP 和 Label 进行灰度，如果是公共的 Namespace则可以同时按 AppId，客户端的 IP 和客户端的 Label 进行灰度<br>&nbsp;&nbsp;4.灰度发布<br>灰度版本最终有两种结果:<b>全量发布和放弃灰度</b><br><b>全量发布</b>:灰度的配置合到主版本并发布，所有的客户端都会使用合并后的配置<br><b>放弃灰度</b>:删除灰度版本，所有的客户端都会使用回主版本的配置<br>注意事项:<br>&nbsp;&nbsp;1.如果灰度版本已经有灰度发布过，那么修改灰度规则后，无需再次灰度发布就立即生效",
      "By creating grayscale version, you can do grayscale test for some configurations. <br> Grayscale process is as follows: <br> &nbsp; &nbsp; 1. Create grayscale version <br> &nbsp; &nbsp; 2. Configure grayscale configuration items <br> &nbsp; &nbsp; 3. Configure grayscale rules. If it is a private namespace, it can be grayed according to the IP and Label of client. If it is a public namespace, it can be grayed according to appId, IP and Label. <br> &nbsp; &nbsp; 4. Grayscale release <br> Grayscale version has two final results: <b> Full release and Abandon grayscale</b> <br> <b>Full release</b>: grayscale configurations are merged with the main version and released, all clients will use the merged configurations <br> <b> Abandon grayscale</b>: Delete grayscale version. All clients will use the configurations of the main version<br> Notice: <br> &nbsp; &nbsp; 1. If the grayscale version has been released, then the grayscale rules will be effective immediately without the need to release grayscale configuration again."
